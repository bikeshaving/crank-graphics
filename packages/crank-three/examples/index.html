<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crank + Three.js Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        #controls h3 {
            margin: 0 0 10px 0;
        }
        
        #controls button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px 5px 5px 0;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        
        #controls button:hover {
            background: #0056b3;
        }
        
        #status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="controls">
        <h3>Three.js Demo Controls</h3>
        <button onclick="app.toggleAnimation()">Toggle Animation</button>
        <button onclick="app.changeShape()">Change Shape</button>
        <button onclick="app.resetPosition()">Reset Position</button>
        <br>
        <small>Check console for more commands</small>
    </div>
    
    <div id="status">
        <div>Status: <span id="animation-status">Running</span></div>
        <div>Shape: <span id="current-shape">box</span></div>
        <div>FPS: <span id="fps">--</span></div>
    </div>

    <script type="module">
        // Import and run the main demo
        import './main.tsx';
        
        // Update status display
        let lastTime = performance.now();
        let frameCount = 0;
        
        function updateStatus() {
            const state = window.app?.getState();
            if (state) {
                document.getElementById('animation-status').textContent = 
                    state.isAnimating ? 'Running' : 'Paused';
                document.getElementById('current-shape').textContent = state.currentShape;
            }
            
            // Calculate FPS
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount.toString();
                frameCount = 0;
                lastTime = now;
            }
            
            requestAnimationFrame(updateStatus);
        }
        
        // Start status updates
        setTimeout(() => {
            updateStatus();
        }, 1000);
    </script>
</body>
</html>
